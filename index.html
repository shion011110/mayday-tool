<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b1220"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Mayday Protocol"
    >

    <title>Mayday Protocol Assistant</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <div id="app">

        <!-- ==================================================
             ヘッダー
        =================================================== -->

        <header class="app-header">

            <div class="header-inner">

                <div class="brand">

                    <div class="brand-mark">
                        MP
                    </div>

                    <div class="brand-text">

                        <h1>
                            Mayday Protocol
                        </h1>

                        <div class="brand-subtitle">
                            ASSISTANT
                        </div>

                    </div>

                </div>

                <button
                    id="descriptionToggle"
                    class="button button-secondary header-button"
                    type="button"
                >
                    概要を表示
                </button>

            </div>

        </header>


        <!-- ==================================================
             メイン
        =================================================== -->

        <main class="main-content">

            <!-- ==============================================
                 概要
            =============================================== -->

            <section
                id="descriptionPanel"
                class="description-panel hidden"
            >

                <div class="description-title">
                    Mayday Protocol Assistant
                </div>

                <p>
                    共通計器を入力し、対応するパズルを選択してください。
                    入力した計器情報とクリア状態は、この端末内に保存されます。
                </p>

            </section>


            <!-- ==============================================
                 共通計器
            =============================================== -->

            <section class="panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            共通計器
                        </h2>

                        <div class="panel-subtitle">
                            COMMON GAUGES
                        </div>

                    </div>

                    <button
                        id="gaugeToggle"
                        class="button button-secondary small-button"
                        type="button"
                    >
                        計器を非表示
                    </button>

                </div>


                <div
                    id="gaugePanel"
                    class="gauge-grid"
                >

                    <label class="gauge-card">

                        <span class="gauge-name">
                            Fuel
                        </span>

                        <input
                            id="gauge-fuel"
                            data-gauge="fuel"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            placeholder="未入力"
                        >

                    </label>


                    <label class="gauge-card">

                        <span class="gauge-name">
                            Oil Pressure
                        </span>

                        <input
                            id="gauge-oil-pressure"
                            data-gauge="oil_pressure"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            placeholder="未入力"
                        >

                    </label>


                    <label class="gauge-card">

                        <span class="gauge-name">
                            Airspeed
                        </span>

                        <input
                            id="gauge-airspeed"
                            data-gauge="airspeed"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            placeholder="未入力"
                        >

                    </label>


                    <label class="gauge-card">

                        <span class="gauge-name">
                            Altimeter
                        </span>

                        <input
                            id="gauge-altimeter"
                            data-gauge="altimeter"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            placeholder="未入力"
                        >

                    </label>


                    <label class="gauge-card">

                        <span class="gauge-name">
                            Tachometer
                        </span>

                        <input
                            id="gauge-tachometer"
                            data-gauge="tachometer"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            placeholder="未入力"
                        >

                    </label>


                    <label class="gauge-card">

                        <span class="gauge-name">
                            Temperature
                        </span>

                        <input
                            id="gauge-temperature"
                            data-gauge="temperature"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            placeholder="未入力"
                        >

                    </label>


                    <label class="gauge-card">

                        <span class="gauge-name">
                            Ammeter
                        </span>

                        <input
                            id="gauge-ammeter"
                            data-gauge="ammeter"
                            type="text"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            placeholder="未入力"
                        >

                    </label>

                </div>

            </section>


            <!-- ==============================================
                 パズル一覧
            =============================================== -->

            <section class="panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            パズル一覧
                        </h2>

                        <div class="panel-subtitle">
                            PUZZLES
                        </div>

                    </div>

                    <div
                        id="clearCount"
                        class="clear-count"
                    >
                        0 / 13 CLEAR
                    </div>

                </div>


                <div
                    id="puzzleGrid"
                    class="puzzle-grid"
                >
                    <!-- JavaScriptで生成 -->
                </div>

            </section>


            <!-- ==============================================
                 データ操作
            =============================================== -->

            <section class="panel danger-panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            データ
                        </h2>

                        <div class="panel-subtitle">
                            LOCAL DATA
                        </div>

                    </div>

                </div>


                <div class="data-actions">

                    <button
                        id="clearPuzzleDataButton"
                        class="button button-secondary"
                        type="button"
                    >
                        パズル進行状況をリセット
                    </button>

                    <button
                        id="clearAllDataButton"
                        class="button button-danger"
                        type="button"
                    >
                        すべてのデータをリセット
                    </button>

                </div>

            </section>

        </main>


        <!-- ==================================================
             パズル画面
        =================================================== -->

        <div
            id="puzzleScreen"
            class="puzzle-screen hidden"
        >

            <div class="puzzle-page">

                <div class="puzzle-page-header">

                    <button
                        id="puzzleBackButton"
                        class="button button-secondary"
                        type="button"
                    >
                        ← パズル一覧へ戻る
                    </button>

                </div>


                <div class="placeholder-panel">

                    <div
                        id="placeholderNumber"
                        class="placeholder-number"
                    >
                        01
                    </div>

                    <h2
                        id="placeholderTitle"
                    >
                        パズル
                    </h2>

                    <p>
                        このパズルはこれからスマホ版へ移植します。
                    </p>

                    <div class="placeholder-note">
                        Windows版の判定ロジックを維持したまま、
                        スマホ操作向けの画面に作り直します。
                    </div>

                </div>

            </div>

        </div>


        <!-- ==================================================
             確認ダイアログ
        =================================================== -->

        <div
            id="dialogOverlay"
            class="dialog-overlay hidden"
        >

            <div class="dialog">

                <h3
                    id="dialogTitle"
                >
                    確認
                </h3>

                <p
                    id="dialogMessage"
                >
                </p>

                <div class="dialog-actions">

                    <button
                        id="dialogCancel"
                        class="button button-secondary"
                        type="button"
                    >
                        キャンセル
                    </button>

                    <button
                        id="dialogConfirm"
                        class="button button-danger"
                        type="button"
                    >
                        リセット
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="./js/store.js"></script>
    <script src="./js/puzzle_common.js"></script>

    <script src="./js/puzzles/signal_color.js"></script>
    <script src="./js/puzzles/emergency_frequency.js"></script>
    <script src="./js/puzzles/threat_mapping.js"></script>
    <script src="./js/puzzles/altitude_verification.js"></script>
    <script src="./js/puzzles/circuit_flow.js"></script>
    <script src="./js/puzzles/shape_collision.js"></script>
    <script src="./js/puzzles/pressure_emergency.js"></script>
    <script src="./js/puzzles/multi_circuit_switch.js"></script>
    <script src="./js/puzzles/guidance_override.js"></script>
    <script src="./js/puzzles/radar_navigation.js"></script>
    <script src="./js/puzzles/codeword_protocol.js"></script>
    <script src="./js/puzzles/damage_report.js"></script>
    <script src="./js/puzzles/final_stabilization.js"></script>


    <script src="./js/app.js"></script>

</body>
</html>
